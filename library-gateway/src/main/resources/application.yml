server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  application:
    name: library-gateway
  cloud:
    gateway:
      globalcors:
        # Preflight requests are answered at the edge. Without an explicit configuration the
        # gateway's handler mapping rejects every CORS preflight with 403 before it can be
        # forwarded to the API, so a browser could never send a Bearer token cross-origin.
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins: ${ELIBRARY_CORS_ALLOWED_ORIGINS:http://localhost:8088,http://127.0.0.1:8088,http://192.168.68.108:8088,http://localhost:8080,http://127.0.0.1:8080}
            allowedMethods: GET,POST,OPTIONS
            allowedHeaders: Authorization,Content-Type,Accept,X-Trace-Id
            exposedHeaders: Location,X-Trace-Id
            maxAge: 3600
      default-filters:
        # The API also applies its own CORS filter (it can be called directly). Keep exactly
        # one copy of each header when the gateway and the downstream service agree.
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      routes:
        - id: e-library-service
          uri: ${LIBRARY_API_URI:http://localhost:8080}
          predicates:
            - Path=/api/v1/**
      httpclient:
        connect-timeout: 2000
        response-timeout: 10s
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  pattern:
    level: "%5p [traceId:%X{traceId:-}]"
  level:
    com.example.elibrary: INFO
