server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: e-library-service
  datasource:
    url: "${DATABASE_URL:jdbc:postgresql://localhost:5432/elibrary}"
    username: ${DATABASE_USERNAME:elibrary}
    password: ${DATABASE_PASSWORD:elibrary-dev-password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
      hibernate.jdbc.time_zone: UTC
      hibernate.format_sql: false
    show-sql: false
  flyway:
    enabled: true
    locations: "classpath:db/migration/common,classpath:db/migration/postgresql"
    baseline-on-migrate: false
  lifecycle:
    timeout-per-shutdown-phase: 20s
  web:
    locale: en
    locale-resolver: fixed
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

elibrary:
  cache:
    ttl: ${ELIBRARY_CACHE_TTL:30s}
    maximum-size: ${ELIBRARY_CACHE_MAX_SIZE:10000}
    record-stats: ${ELIBRARY_CACHE_RECORD_STATS:true}
  security:
    mode: ${ELIBRARY_SECURITY_MODE:hmac}
    jwt-secret: ${ELIBRARY_JWT_SECRET:dev-only-hmac-secret-change-me-please-32-bytes}
    issuer: ${ELIBRARY_JWT_ISSUER:elibrary-local}
    token-ttl: ${ELIBRARY_TOKEN_TTL:PT8H}
    cors-allowed-origins: ${ELIBRARY_CORS_ALLOWED_ORIGINS:http://localhost:8088,http://127.0.0.1:8088,http://192.168.68.108:8088,http://localhost:8080,http://127.0.0.1:8080}

logging:
  pattern:
    level: "%5p [traceId:%X{traceId:-}]"
  level:
    com.example.elibrary: INFO
