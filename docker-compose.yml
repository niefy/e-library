name: e-library

# Local, single-host topology. Production runs the same stateless images behind
# a load balancer with a managed PostgreSQL cluster; see docs/architecture.md.

services:
  api:
    build:
      context: .
      dockerfile: library-api/Dockerfile
    image: e-library-service:local
    environment:
      SPRING_PROFILES_ACTIVE: dev
      ELIBRARY_DB_PATH: /app/data/library.db
      ELIBRARY_JWT_SECRET: ${ELIBRARY_JWT_SECRET:-local-dev-hmac-secret-please-change-me-32b}
      ELIBRARY_JWT_ISSUER: ${ELIBRARY_JWT_ISSUER:-elibrary-compose}
      ELIBRARY_CORS_ALLOWED_ORIGINS: ${ELIBRARY_CORS_ALLOWED_ORIGINS:-http://localhost:8088,http://127.0.0.1:8088,http://192.168.68.108:8088}
    volumes:
      - library-data:/app/data
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 40s
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: library-gateway/Dockerfile
    image: library-gateway:local
    environment:
      LIBRARY_API_URI: http://api:8080
      ELIBRARY_CORS_ALLOWED_ORIGINS: ${ELIBRARY_CORS_ALLOWED_ORIGINS:-http://localhost:8088,http://127.0.0.1:8088,http://192.168.68.108:8088}
    ports:
      - "8081:8081"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: library-web/Dockerfile
    image: e-library-web:local
    ports:
      - "8088:80"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  library-data:
